name: Deploy to Production

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Prod Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_PROD }}" | sf org login sfdx-url \
            --sfdx-url-stdin \
            --alias prod-org \
            --set-default

      - name: Verify authentication
        run: sf org display --target-org prod-org

      - name: Deploy to Production
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org prod-org \
            --wait 30

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org prod-org \
            --test-level RunLocalTests \
            --wait 30 \
            --result-format human
