name: Deploy to UAT

on:
  pull_request:
    branches: [uat]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to UAT Org
        run: |
          TOKEN_RESPONSE=$(curl -s https://playful-wolf-2f1pkm-dev-ed.trailblaze.my.salesforce.com/services/oauth2/token \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.UAT_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.UAT_CLIENT_SECRET }}")

          echo "Token Response received"

          INSTANCE_URL=$(echo $TOKEN_RESPONSE | jq -r '.instance_url')
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Authentication failed!"
            echo "$TOKEN_RESPONSE" | jq .
            exit 1
          fi

          echo "Authentication successful!"
          echo "Instance URL: $INSTANCE_URL"

          cat > sfdx-auth.json << EOF
          {
            "instanceUrl": "$INSTANCE_URL",
            "accessToken": "$ACCESS_TOKEN",
            "orgId": "$(echo $ACCESS_TOKEN | cut -d'!' -f1)"
          }
          EOF

          sf org login sfdx-url \
            --sfdx-url-stdin \
            --alias uat-org << EOF
          force://${{ secrets.UAT_CLIENT_ID }}:${{ secrets.UAT_CLIENT_SECRET }}:$ACCESS_TOKEN@$(echo $INSTANCE_URL | sed 's|https://||')
          EOF

      - name: Deploy to UAT Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org uat-org \
            --wait 30

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org uat-org \
            --test-level RunLocalTests \
            --wait 30 \
            --result-format human
