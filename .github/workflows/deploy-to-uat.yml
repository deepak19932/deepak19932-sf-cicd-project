name: Deploy to UAT

on:
  pull_request:
    branches: [uat]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to UAT Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_UAT }}" > sfdx_auth_url.txt
          sf org login sfdx-url --sfdx-url-file sfdx_auth_url.txt --alias uat-org --set-default
          rm -f sfdx_auth_url.txt

      - name: Verify authentication
        run: sf org display --target-org uat-org

      - name: Deploy to UAT Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org uat-org \
            --wait 30

      - name: Run Apex Tests (if any exist)
        run: |
          TEST_CLASSES=$(find force-app -name "*Test*.cls" -o -name "*_Test.cls" 2>/dev/null | wc -l)
          if [ "$TEST_CLASSES" -gt 0 ]; then
            sf apex run test \
              --target-org uat-org \
              --test-level RunLocalTests \
              --wait 30 \
              --result-format human
          else
            echo "No Apex test classes found, skipping tests."
          fi
