name: Deploy to UAT

on:
  pull_request:
    branches: [uat]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to UAT Org
        run: |
          echo "${{ secrets.UAT_SFDX_AUTH_URL }}" > sfdx_auth_url.txt
          sf org login sfdx-url --sfdx-url-file sfdx_auth_url.txt --alias uat-org --set-default
          rm -f sfdx_auth_url.txt

      - name: Verify authentication
        run: sf org display --target-org uat-org

      - name: Deploy to UAT Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org uat-org \
            --wait 30

      - name: Run Apex Tests
        run: |
          TEST_CLASSES=$(find force-app -name "*Test*.cls" 2>/dev/null | sed 's|.*/||;s|\.cls||' | tr '\n' ',' | sed 's/,$//')
          if [ -n "$TEST_CLASSES" ]; then
            echo "Running tests: $TEST_CLASSES"
            sf apex run test \
              --target-org uat-org \
              --tests $TEST_CLASSES \
              --wait 30 \
              --result-format human
          else
            echo "No Apex test classes found, skipping tests."
          fi
