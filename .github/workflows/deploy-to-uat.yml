name: Deploy to UAT

on:
  pull_request:
    branches: [uat]
    types: [closed]

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to UAT Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_UAT }}" | sf org login sfdx-url \
            --sfdx-url-stdin \
            --alias uat-org \
            --set-default

      - name: Verify authentication
        run: sf org display --target-org uat-org

      - name: Deploy to UAT Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org uat-org \
            --wait 30

      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org uat-org \
            --test-level RunLocalTests \
            --wait 30 \
            --result-format human
